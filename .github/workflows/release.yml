name: Upstream Plus Patches

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [downstream]
    paths: ["patches/**", "scripts/**", ".github/workflows/release.yml"]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: upstream-plus-patches
  cancel-in-progress: false

jobs:
  prepare:
    name: Select One Snapshot And Request Review
    if: >-
      (github.event_name != 'issue_comment' &&
       github.event_name != 'pull_request_target') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
       github.event.comment.user.type == 'Bot') ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.base.ref == 'downstream' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'repair/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      ready: ${{ steps.snapshot.outputs.ready }}
      sha: ${{ steps.snapshot.outputs.sha }}
      upstream: ${{ steps.snapshot.outputs.upstream }}
      patchset: ${{ steps.snapshot.outputs.patchset }}
      version: ${{ steps.snapshot.outputs.version }}
      release: ${{ steps.snapshot.outputs.release }}
      pr: ${{ steps.snapshot.outputs.pr }}
      mode: ${{ steps.snapshot.outputs.mode }}
      repair_pr: ${{ steps.snapshot.outputs.repair_pr }}
      repair_head: ${{ steps.snapshot.outputs.repair_head }}
      followup: ${{ steps.snapshot.outputs.followup }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require The Trusted Default Branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$DEFAULT_BRANCH" = downstream
      - name: Test Release Policy
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Prepare The Exact Source And Review
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
        run: python3 scripts/release.py prepare "$RUNNER_TEMP/9router-source"
      - name: Report The Actual State
        if: always()
        env:
          READY: ${{ steps.snapshot.outputs.ready }}
          REASON: ${{ steps.snapshot.outputs.reason }}
          SOURCE_SHA: ${{ steps.snapshot.outputs.sha }}
          VERSION: ${{ steps.snapshot.outputs.version }}
          PR: ${{ steps.snapshot.outputs.pr }}
        run: |
          {
            echo "### Upstream plus patches"
            printf '%s\n' "- State: ${REASON:-stopped before a decision}"
            printf '%s\n' "- Review accepted: ${READY:-false}"
            if [ -n "$SOURCE_SHA" ]; then printf '%s\n' "- Application: $VERSION at $SOURCE_SHA"; fi
            if [ -n "$PR" ]; then printf '%s\n' "- Review PR: #$PR"; fi
            echo "- GitHub never deploys; the VPS recipe consumes verified releases"
          } >> "$GITHUB_STEP_SUMMARY"

  policy-check:
    name: Check Proposed Policy Without Write Credentials
    needs: prepare
    if: always() && needs.prepare.outputs.mode == 'policy'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.repair_head }}
          path: candidate
          persist-credentials: false
      - name: Enforce The Trusted Tests And Validate Proposed YAML
        run: python3 trusted/scripts/release.py check-policy "$GITHUB_WORKSPACE/candidate"

  test:
    name: Test The Historical Application Contracts
    needs: prepare
    if: needs.prepare.outputs.ready == 'true' && needs.prepare.outputs.mode == 'application'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
      UPSTREAM_DIR: ${{ github.workspace }}/upstream
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decolua/9router
          ref: ${{ needs.prepare.outputs.upstream }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Application And Test Dependencies
        working-directory: app
        run: |
          npm exec --yes --package=npm@11.20.0 -- npm install --no-audit --no-fund
          npm exec --yes --package=npm@11.20.0 -- npm --prefix tests install --no-audit --no-fund
      - name: Run Every Preserved Regression File
        run: python3 trusted/scripts/release.py test "$GITHUB_WORKSPACE/app"

  build:
    name: Build And Smoke Test One Container
    needs: [prepare, test]
    if: needs.prepare.outputs.repair_pr == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE_TAG: 9router-reviewed:${{ needs.prepare.outputs.sha }}
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
      UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
      PATCHSET_SHA256: ${{ needs.prepare.outputs.patchset }}
      CONFIG_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build From The Immutable Remote Git Context
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/${{ github.repository }}.git#${{ needs.prepare.outputs.sha }}
          platforms: linux/amd64
          tags: ${{ env.IMAGE_TAG }}
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.CANDIDATE_SHA }}
            org.opencontainers.image.version=${{ env.APP_VERSION }}
            io.9router.upstream.revision=${{ env.UPSTREAM_SHA }}
            io.9router.patches.sha256=${{ env.PATCHSET_SHA256 }}
          outputs: type=docker,dest=${{ runner.temp }}/9router-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Load And Check Runtime Health And Version
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/9router-image.tar"
          docker run --detach --name 9router-smoke --security-opt=no-new-privileges:true \
            --publish 127.0.0.1::20128 \
            --env INITIAL_PASSWORD="$(openssl rand -hex 24)" \
            --env JWT_SECRET="$(openssl rand -hex 32)" \
            "$IMAGE_TAG"
          port=$(docker port 9router-smoke 20128/tcp | cut -d: -f2)
          healthy=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:$port/api/health" > "$RUNNER_TEMP/health.json"; then
              if python3 -c 'import json,sys; assert json.load(open(sys.argv[1])).get("ok") is True' "$RUNNER_TEMP/health.json"; then
                healthy=true
                break
              fi
            fi
            sleep 2
          done
          test "$healthy" = true
          curl --fail --silent "http://127.0.0.1:$port/api/version" > "$RUNNER_TEMP/version.json"
          python3 -c 'import json,os,sys; assert json.load(open(sys.argv[1]))["currentVersion"] == os.environ["APP_VERSION"]' "$RUNNER_TEMP/version.json"
      - name: Show Smoke Logs And Remove Only The Test Container
        if: always()
        run: |
          docker logs 9router-smoke 2>&1 || true
          docker rm --force 9router-smoke || true
      - name: Package The Verified Image
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gzip -n -c "$RUNNER_TEMP/9router-image.tar" > "$RUNNER_TEMP/release/9router-image.tar.gz"
          python3 scripts/release.py provenance "$RUNNER_TEMP/release/9router-image.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-${{ needs.prepare.outputs.sha }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Recheck Review And Publish Without Deploying
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-${{ needs.prepare.outputs.sha }}
          path: release
      - name: Publish Only This Verified Candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
          CANDIDATE_PR: ${{ needs.prepare.outputs.pr }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
          PATCHSET_SHA256: ${{ needs.prepare.outputs.patchset }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release }}
          REPAIR_HEAD: ${{ needs.prepare.outputs.repair_head }}
        run: python3 scripts/release.py publish "$GITHUB_WORKSPACE/release"

  land:
    name: Adopt Only The Verified Repair And Restart Verification
    needs: [prepare, policy-check, test]
    if: >-
      always() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.ready == 'true' &&
      needs.prepare.outputs.repair_pr != '' &&
      ((needs.prepare.outputs.mode == 'policy' && needs.policy-check.result == 'success') ||
       (needs.prepare.outputs.mode == 'application' && needs.test.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck Review, Adopt The Diff, And Dispatch A Fresh Cycle
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_PR: ${{ needs.prepare.outputs.repair_pr }}
          REPAIR_HEAD: ${{ needs.prepare.outputs.repair_head }}
          CANDIDATE_PR: ${{ needs.prepare.outputs.pr }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
        run: python3 scripts/release.py land "$RUNNER_TEMP/9router-land"

  repair:
    name: Request Native Codex Repair Or Escalate Explicitly
    needs: [prepare, policy-check, test, build, publish, land]
    if: always() && (contains(needs.*.result, 'failure') || needs.prepare.outputs.followup == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Repair The Actual Failure Without Publishing Or Deploying
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
          CANDIDATE_PR: ${{ needs.prepare.outputs.pr }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
          REPAIR_HEAD: ${{ needs.prepare.outputs.repair_head }}
          NONBLOCKING_FOLLOWUP: ${{ !contains(needs.*.result, 'failure') && needs.prepare.outputs.followup == 'true' }}
        run: python3 scripts/release.py repair "$RUNNER_TEMP/9router-repair"
